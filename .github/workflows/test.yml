name: Ruby tests and lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4
      - name: Install Gosu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-dev libgl1-mesa-dev libopenal-dev \
            libsndfile1-dev libmpg123-dev libopusfile-dev libvorbis-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Run RuboCop
        run: bundle exec rake lint
